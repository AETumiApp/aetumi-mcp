name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server.json', '.github/workflows/publish-mcp.yml']
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o p.tar.gz
          tar xzf p.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
